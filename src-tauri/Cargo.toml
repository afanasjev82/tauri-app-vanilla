[package]
name = "tauri-app-vanilla"
version = "0.0.0"
description = "A Tauri App"
authors = ["Dmitri Afanasjev <adimas@gmail.com>"]
license = ""
repository = "https://github.com/afanasjev82/tauri-app-vanilla"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-cli = "2.5"
tauri-plugin-window-state = "2.5"

[features]
# this feature is used for production builds or when `devUrl` is not set
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
